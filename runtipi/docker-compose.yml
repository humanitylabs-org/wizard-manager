{
  "services": {
    "wizard-manager": {
      "image": "python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4",
      "user": "0:0",
      "working_dir": "/app",
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "256m",
      "tmpfs": [
        "/tmp"
      ],
      "read_only": true,
      "environment": {
        "PORT": "8799",
        "BIND": "0.0.0.0",
        "DATA_DIR": "/data",
        "PYTHONDONTWRITEBYTECODE": "1",
        "WIZARD_TRUSTED_HOSTS": "${WIZARD_TRUSTED_HOSTS:-}",
        "WIZARD_TRUSTED_ORIGINS": "${WIZARD_TRUSTED_ORIGINS:-}",
        "MANAGER_WAS_URL": "${MANAGER_WAS_URL:-}",
        "MANAGER_MODEL_URL": "${MANAGER_MODEL_URL:-}",
        "WIZARD_ROUTER_KEY": "${WIZARD_ROUTER_KEY:-}",
        "MANAGER_READY_DB": "${MANAGER_READY_DB:-}"
      },
      "volumes": [
        "${APP_SOURCE_DIR}:/app:ro",
        "${APP_DATA_DIR}/data:/data"
      ],
      "command": [
        "python",
        "/app/app/server.py"
      ],
      "x-runtipi": {
        "is_main": true,
        "internal_port": 8799
      }
    }
  },
  "x-runtipi": {
    "schema_version": 2,
    "overrides": []
  }
}
