{
  "services": {
    "wizard-manager": {
      "image": "python:3.12-alpine",
      "user": "1000:1000",
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "256m",
      "tmpfs": [
        "/tmp"
      ],
      "read_only": true,
      "environment": {
        "PORT": "8799",
        "BIND": "0.0.0.0",
        "DATA_DIR": "/data",
        "WIZARD_TRUSTED_HOSTS": "${WIZARD_TRUSTED_HOSTS:-}",
        "WIZARD_TRUSTED_ORIGINS": "${WIZARD_TRUSTED_ORIGINS:-}",
        "MANAGER_WAS_URL": "${MANAGER_WAS_URL:-}",
        "MANAGER_MODEL_URL": "${MANAGER_MODEL_URL:-}",
        "WIZARD_ROUTER_KEY": "${WIZARD_ROUTER_KEY:-}",
        "MANAGER_READY_DB": "${MANAGER_READY_DB:-}"
      },
      "volumes": [
        "${APP_DATA_DIR}/data:/data"
      ],
      "command": [
        "python",
        "-c",
        "import base64,json,pathlib,runpy,sys\nroot=pathlib.Path('/tmp/wizard-app');root.mkdir(exist_ok=True)\nfiles=json.loads(base64.b64decode(''))\nfor name,value in files.items():\n p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(value))\nsys.path.insert(0,str(root/'app'));runpy.run_path(str(root/'app/server.py'),run_name='__main__')\n"
      ],
      "x-runtipi": {
        "is_main": true,
        "internal_port": 8799
      }
    }
  },
  "x-runtipi": {
    "schema_version": 2,
    "overrides": []
  }
}
